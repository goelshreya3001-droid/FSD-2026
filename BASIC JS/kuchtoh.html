<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box" draggable="true" style="width:100px;height:100px;background: rgb(140, 255, 0)">
    </div>
    <div id="drop" style="width:200px;height:200px;background:rgb(0, 187, 255)">
    </div>
    <script>
        box.addEventListener("dragstart", function(e){
            e.dataTransfer.setData("Text","box");
        });
        drop.addEventListener("dragover", function(e){
            e.preventDefault();
        });
        box.addEventListener("dragstart", function(e){
            let data =e.dataTransfer.getData("text");
            drop.appendChild(document.getElementById(data));
        });
    </script>

    
    
</body>
</html>
