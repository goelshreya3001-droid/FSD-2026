<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id ="text"></p>
    <!--DOM +event -->
    <button onclick="Toggletext()">Show and hide</button>
    <!--func-cotlin -->
    <script>
        function Toggletext(){
            let t =document.getElementsById("text");//we are get paragraph id 
            if(t.style.display==="none"){//show hora toh hide kr do ...none
             t.style.display="block";
            }
            else{
                t.style.display==="none"
            }
        }
    </script>
</body>
</html>
